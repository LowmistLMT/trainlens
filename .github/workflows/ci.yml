name: CI

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: matrix.python-version != '3.9'
        with:
          python-version: ${{ matrix.python-version }}

      # setup-python has no CPython 3.9 build for Ubuntu 26.04.
      - name: Set up Python 3.9 with uv
        if: matrix.python-version == '3.9'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.9'
          activate-environment: true
          venv-path: ${{ runner.temp }}/trainlens-py39
          enable-cache: false

      - name: Run standard-library tests
        run: |
          python --version
          python -B -S -m unittest discover -s tests -v

      - name: Smoke-test both offline demos
        shell: bash
        run: |
          set -euo pipefail
          scripts=skills/trainlens/scripts
          for suite in llm-sft mmseg-cityscapes; do
            demo="skills/trainlens/assets/demo-logs/$suite"
            python -B -S "$scripts/scan_runs.py" "$demo"
            python -B -S "$scripts/compare_runs.py" "$demo" --config-diff --per-class --format md
            python -B -S "$scripts/diagnose.py" "$demo" --format md
            python -B -S "$scripts/render_report.py" "$demo" --per-class
          done
